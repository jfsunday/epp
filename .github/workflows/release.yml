name: Build E++ Windows Binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build (Windows)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epp-windows
          path: dist/epp.exe
